[package]
name = "nimrs-firmware"
version = "0.1.0"
edition = "2021"
resolver = "2"

[dependencies]
esp-idf-sys = "0.37"
log = "0.4"
env_logger = "0.11"
anyhow = "1"

[package.metadata.esp-idf-sys]
esp_idf_tools_install_dir = "fromenv"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = "symbols"
