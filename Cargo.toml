[workspace]
members = ["crates/core", "."]
resolver = "2"

[package]
name = "nimrs-firmware"
version = "0.1.0"
edition = "2021"

[dependencies]
esp-idf-sys = { path = "vendor/esp-idf-sys" }
nimrs-core = { path = "crates/core" }
log = "0.4"
once_cell = "1"

[build-dependencies]
embuild = "0.33"

[package.metadata.esp-idf-sys]
esp_idf_tools_install_dir = "fromenv"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = "symbols"
